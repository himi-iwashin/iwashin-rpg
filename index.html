function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v?.state){let state=v.state;state.restored||={river:false,port:false,sea:false,cape:false};state.restored.cape??=false;state.postgameCleared??=false;if(state.restored.sea)state.ending=true;return state;}let old=oldSave();if(old){let n=fresh(old.name||'ユウ');n.job=old.job==='tide'?'潮読み':old.job==='guardian'?'海守り':'剣士';n.lv=old.lv||1;n.xp=old.xp||0;n.gold=old.gold||100;n.unlocked=['nagi','toto',...(old.unlocked||[]).filter(id=>!['nagi','toto'].includes(id))];n.guest=old.activeGuest||null;n.items={...n.items,...old.items};n.log='冒険を新しい氷見の地図に引き継いだ。まずは駅前を歩いてみよう。';return n}}catch{}return null}
function save(){if(s)localStorage.setItem(KEY,JSON.stringify({state:s}))}
function stats(id){let base=id==='hero'?{name:s.name,job:s.job,icon:'🧑',hp:48,mp:15,atk:11,def:8}:people[id];let n=s.lv-1,g=s.gear[id]||{},w=weapons.find(x=>x.n===g.w),a=armors.find(x=>x.n===g.a),x=Object.values(rewards).flat().find(v=>v.n===g.x);return {name:base.name,job:base.job,icon:base.icon,hpmax:base.hp+n*4,mpmax:base.mp+n*2,atk:base.atk+n+(w?.a||0),def:base.def+n+(a?.d||0)+(x?.d||0),skills:base.skills||[]}}
function ids(){return ['hero','nagi','toto',...(s.guest?[s.guest]:[])]}
function vital(){for(let id of ['hero',...s.unlocked]){s.gear[id]??={w:'',a:'',x:''};s.gear[id].x??='';let st=stats(id);s.hp[id]??=st.hpmax;s.mp[id]??=st.mpmax;s.hp[id]=Math.min(st.hpmax,s.hp[id]);s.mp[id]=Math.min(st.mpmax,s.mp[id])}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initAudio(){try{if(!audio){let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=new C(),g=ctx.createGain();g.gain.value=.16;g.connect(ctx.destination);audio={ctx,g,m:null}}if(audio.ctx.state==='suspended')audio.ctx.resume();if(music&&!audio.m)startMusic()}catch{}}
function tone(f,d=.1,w='triangle',v=.22,delay=0){if(!audio)return;let t=audio.ctx.currentTime+delay,o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.g);o.start(t);o.stop(t+d)}
function sfx(k='step'){if(!audio)return;let q={step:[240,.035,'sine',.08],text:[470,.025,'square',.12],ok:[720,.12,'triangle',.25],hit:[120,.16,'sawtooth',.3],heal:[820,.2,'sine',.24],boss:[90,.45,'sawtooth',.36],coin:[980,.09,'square',.2],door:[300,.12,'triangle',.17],win:[660,.28,'triangle',.25]}[k]||[440,.06,'triangle',.15];tone(...q)}
function startMusic(){if(!audio||!music)return;clearInterval(audio.m);let seq=[392,0,494,587,0,523,494,0,392,440,494,0,349,392,0,330],i=0;audio.m=setInterval(()=>{if(!music||audio.ctx.state!=='running')return;let n=seq[i++%seq.length];if(n)tone(n,.24,'triangle',.055);if(i%4===0)tone(196,.3,'sine',.03)},300)}
function say(t){clearInterval(typing);let el=document.querySelector('#narration');if(!el)return;let a=[...t],i=0;el.textContent='';typing=setInterval(()=>{if(i>=a.length){clearInterval(typing);typing=null;return}el.textContent+=a[i++];if(i%3===0&&music)sfx('text')},18);el.onclick=()=>{if(typing){clearInterval(typing);typing=null;el.textContent=t}}}
function title(){app.innerHTML=`<div class="top"><div class="brand">中村海産 presents<small>HIMI SEA TALES · RPG</small></div><button class="icon" onclick="window.toggleSound()">🔊 音 ${music?'ON':'OFF'}</button></div><section class="card titlecard"><div class="scene-art">🌊🐟✨</div><div class="scene-title">氷見の海と、<br>星を食べるもの</div><p>駅前から港、山あいの川、沖の深海へ。歩いて見つけた人や景色が、冒険の手がかりになる。</p><div class="modal-actions">${load()?'<button class="btn primary" onclick="window.continueGame()">▶ つづきから</button>':''}<button class="btn primary" onclick="window.newGame()">🌟 はじめから</button></div></section><footer class="footer"><span>スマホ対応・この端末にセーブ</span><span>画面をタップすると音が始まります</span></footer>`}
function openModal(h){overlay.innerHTML=`<section class="modal">${h}</section>`;overlay.classList.remove('hidden')}
function closeModal(){overlay.classList.add('hidden');overlay.innerHTML='';render()}
function newGame(){initAudio();openModal(`<h2>冒険の準備</h2><p>名前と職業を決めよう。職業は旅の途中で変わらない。</p><input id="heroName" class="input" maxlength="8" value="ユウ"><div class="modal-actions">${['剣士','潮読み','海守り'].map(j=>`<button class="btn choice" onclick="window.startNew('${j}')">${j}<span>${j==='剣士'?'攻撃が得意':j==='潮読み'?'潮の魔法を使う':'守りと回復が得意'}</span></button>`).join('')}</div><button class="btn" onclick="window.closeModal()">戻る</button>`)}
function startNew(job){s=fresh((document.querySelector('#heroName')?.value||'ユウ').trim()||'ユウ',job);vital();save();overlay.classList.add('hidden');render();initAudio();sfx('ok')}
function continueGame(){s=load();if(s){s.area=s.area||'town';s.restored||={river:false,port:false,sea:false};s.visited||=['town'];s.tactic||='balanced';vital();overlay.classList.add('hidden');render();initAudio()}}
function members(){return ids().map(id=>{let a=stats(id),h=s.hp[id]??a.hpmax,m=s.mp[id]??a.mpmax;return `<div class="member"><div class="name">${a.icon} ${esc(a.name)}${s.dead[id]?' 💫':''}</div><div class="job">${esc(a.job)}</div><div class="bar"><i style="width:${Math.max(0,h/a.hpmax*100)}%"></i></div><div class="nums"><span>HP ${Math.max(0,h)}/${a.hpmax}</span></div><div class="bar mp"><i style="width:${Math.max(0,m/a.mpmax*100)}%"></i></div><div class="nums"><span>MP ${Math.max(0,m)}/${a.mpmax}</span></div></div>`}).join('')}
function getEntities(area=s.area){let a=maps[area]?.entities||[];if(area==='river'&&s.restored.river)return a.filter(e=>e.type!=='boss').map(e=>e.type==='npc'?{...e,name:'川辺の人',icon:'😊'}:e);if(area==='port'&&s.restored.port)return a.filter(e=>e.type!=='boss').map(e=>e.type==='npc'?{...e,name:'網元',icon:'😊'}:e);if(area==='sea'&&s.restored.sea)return a.filter(e=>e.type!=='boss');return a.filter(e=>!(e.type==='boss'&&s.restored[area]))}
function signAt(x,y){return maps[s.area]?.signs?.find(a=>a.x===x&&a.y===y)}
function tileClass(x,y){if(maps[s.area]?.blocks?.some(a=>a[0]===x&&a[1]===y))return 'rock';let theme=areaInfo[s.area].terrain;if(s.area==='town')return (y===3||x===0||x===3||x===7)?'road':(y===0||y===5)?'water':'grass';if(s.area==='river')return (x===0||x===7||y===3)?'road':(x===3||x===5)?'water':'wood';if(s.area==='port')return (x===0||x===7||y===3)?'road':(y<2||y>4)?'water':'sand';if(s.area==='sea')return 'water';if(s.area==='cape')return (x===0||x===7||y===3)?'road':'sand';if(s.area==='house')return 'floor';return theme}
function renderMap(){let ent=getEntities();let tile='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let e=ent.find(a=>a.x===x&&a.y===y),sign=signAt(x,y),icon=e?.icon||(sign?'🪧':'');if(e?.type==='gate'&&((s.area==='river'&&!s.restored.river)||(s.area==='port'&&!s.restored.port)||(s.area==='sea'&&!s.restored.sea)))icon='🔒';let player=s.x===x&&s.y===y;tile+=`<button class="tile ${tileClass(x,y)}" aria-label="${sign?.text||e?.name||'道'}" onclick="window.tapTile(${x},${y})">${icon}${player?'<span class="player">🧑</span>':''}${e?`<span class="tag">${esc(e.name)}</span>`:''}</button>`}return tile}
function nearEntities(){return getEntities().filter(e=>Math.abs(e.x-s.x)+Math.abs(e.y-s.y)<=1)}
function guideText(){if(s.battle)return s.battle.boss?'ボス戦だよ！作戦を決めて、みんなで力を合わせよう。':'ぼくが見守ってるよ。作戦に合わせて仲間が動くよ。';if(s.ending&&!s.postgameCleared){if(s.area==='sea')return 'クリア後の章が始まったよ！東端の光の門から「星見の岬」へ進もう。';return '深海から現れた光の道をたどって、星見の岬を目指そう！'}if(s.area==='cape'&&s.postgameCleared)return '星見の岬の試練も達成！町へ戻って、仲間たちの変わった会話を聞こう。';if(s.restored.sea)return '氷見の海に星とみんなの記憶が戻ったよ。クリア後の冒険にも進めるよ！';if(s.restored[s.area])return s.area==='river'?'川が澄んで、小魚が帰ってきたね！':'この場所に活気が戻ったよ。';if(s.area==='town')return '氷見駅前だよ。全体地図で港や山あいへの位置を見てみよう。';if(s.area==='river')return '川の上流に異変があるみたい。東の奥を目指そう。';if(s.area==='port')return '定置網の異変を止めれば、沖への船が出せるよ。';return '深海の星の光を取り戻そう。ぼくも一緒だよ。'}
function cityMap(){let nodes=[['北','灘浦・海岸','北　灘浦',190,35,'まだ行けない海岸線',204,39,'start'],['北東','氷見漁港・ひみ番屋街','北東　漁港・番屋街',305,110,'港と番屋街',305,136,'middle'],['中央','氷見駅・まちなか','氷見駅・まちなか',210,190,'物語の出発点',210,222,'middle'],['東','富山湾','東　富山湾',395,190,'東に広がる海',385,166,'end'],['南東','島尾海岸','南東　島尾海岸',305,275,'海辺の景勝地',318,300,'start'],['西','山あいの川・里山','西　山あいの川',82,190,'川の異変を追う場所',112,168,'end'],['南西','十二町潟・田園','南西　十二町潟',95,285,'水辺と田園',108,310,'start']];openModal(`<h2>🗺️ 氷見市 全体マップ</h2><p>北が上。市街地から港・海、内陸の山あいへ向かう位置関係を示した冒険用の概略図だよ。場所を選ぶと案内が出るよ。</p><svg class="citymap" viewBox="0 0 440 330" role="img" aria-label="氷見市の概略地図。西に山、中央に駅と市街地、東に富山湾"><path d="M0 0H270L302 55 278 105 307 146 275 193 300 244 270 330H0Z" fill="#8dbb7e"/><path d="M0 0H150L185 42 146 70 180 115 120 145 146 192 90 220 126 275 90 330H0Z" fill="#648f67"/><path d="M272 0H440V330H270L300 280 276 240 310 195 281 150 310 106 282 55Z" fill="#72b9cf"/><text x="352" y="53" fill="#14556d" font-size="17" font-weight="bold">富山湾</text><text x="32" y="37" fill="#eff7d8" font-size="15" font-weight="bold">里山・山あい</text><path d="M185 175 C225 165 240 143 292 114 M205 194 C160 190 132 190 80 190 M210 205 C245 225 280 255 305 275" fill="none" stroke="#f5d88a" stroke-width="5" stroke-dasharray="8 5"/>${nodes.map(([dir,name,label,x,y,desc,tx,ty,anchor])=>`<g class="citynode" onclick="window.cityPlace('${esc(name)}','${esc(desc)}')"><circle cx="${x}" cy="${y}" r="${name.includes('氷見駅')?15:10}" fill="${name.includes('氷見駅')?'#d95c48':'#fff4ca'}" stroke="#315b55" stroke-width="3"/><text x="${tx}" y="${ty}" text-anchor="${anchor}" fill="#173f45" font-size="10" font-weight="bold">${label}</text></g>`).join('')}<text x="218" y="183" text-anchor="middle" fill="white" font-size="9">●駅</text></svg><div class="muted">実際の市域の向きと主な地点をもとにしたゲーム用概略図</div><button class="btn" style="width:100%;margin-top:10px" onclick="window.closeModal()">閉じる</button>`)}
function cityPlace(n,d){openModal(`<h2>${n}</h2><p>${d}</p><p>現在地：${areaInfo[s.area].name}<br>イワシん「行き先は立て札にも書いてあるよ。訪れた場所へは移動メニューから乗り物で行けるよ。」</p><button class="btn" onclick="window.cityMap()">地図へ戻る</button><button class="btn" onclick="window.closeModal()">閉じる</button>`)}
function render(){if(!s){title();return}vital();let info=areaInfo[s.area]||areaInfo.town,allDone=s.restored.sea;app.innerHTML=`<header class="top"><div class="brand">氷見の海と、星を食べるもの<small>HIMI SEA TALES · RPG</small></div><div class="tools"><button class="icon" onclick="window.toggleSound()">${music?'🔊':'🔇'} 音 ${music?'ON':'OFF'}</button><button class="icon" onclick="window.menu()">☰</button></div></header><section class="card hero"><div class="scene-art">${allDone?'🌅':info.art}</div><div><div class="location">📍 ${info.name}　${s.restored.river?'🌿':''}${s.restored.port?'⚓':''}${s.restored.sea?'✨':''}</div><div class="scene-title">${allDone?'海に戻った記憶':info.name}</div><div class="narration type" id="narration"></div></div></section><section class="guide"><span class="fish" aria-label="イワシん">🐟</span><span><b>イワシん</b>${esc(guideText())}<br><button class="btn" style="min-height:30px;padding:4px 8px;margin-top:4px" onclick="window.talkIwashin()">💬 イワシんと話す</button> <button class="btn" style="min-height:30px;padding:4px 8px;margin-top:4px" onclick="window.cityMap()">🗺️ 氷見全体マップ</button></span></section>${s.ending?`<div class="sign">${s.postgameCleared?'🌅 クリア後の章も達成！町へ戻ると、救った地域の人々や仲間の会話が変わっています。':'⭐ 次の目的：深海マップ東端の「星見の岬へ」へ進もう。道中の仲間は全回復しています。'}</div>`:''}<section class="card"><div class="worldhead"><strong>🗺️ フィールド</strong><span>${s.x+1}, ${s.y+1}　潮の記憶 ${s.memory}/3</span></div>${signAt(s.x,s.y)?`<div class="sign">🪧 ${esc(signAt(s.x,s.y).text)}</div>`:''}<div class="map ${s.area}">${renderMap()}</div><div class="nearby">${nearEntities().length?'近くに '+nearEntities().map(e=>esc(e.name)).join('・')+' がある':'十字ボタンか、隣のマスをタップして歩こう'}</div><div class="controls"><button class="up" onclick="window.move(0,-1)" aria-label="北へ">▲</button><button class="left" onclick="window.move(-1,0)" aria-label="西へ">◀</button><button class="down" onclick="window.move(0,1)" aria-label="南へ">▼</button><button class="right" onclick="window.move(1,0)" aria-label="東へ">▶</button></div></section><section class="party">${members()}</section><div class="log" id="log">${esc(s.log)}</div><section class="actions"><button class="btn primary" onclick="window.interact()">🔎 調べる</button><button class="btn" onclick="window.travelMenu()">🚌 移動</button><button class="btn" onclick="window.partyMenu()">👥 仲間</button><button class="btn" onclick="window.itemMenu()">🍱 食べ物</button><button class="btn" onclick="window.shopMenu()">🏪 道具・装備</button><button class="btn" onclick="window.saveNow()">💾 セーブ</button></section><footer class="footer"><span>Lv.${s.lv}　${s.gold}G　戦い ${s.wins}回</span><span>十字キーで歩く・近くで調べる</span></footer>`;say(s.log);}
function log(t){s.log=t;save();render()}
function blocked(x,y){return maps[s.area]?.blocks?.some(a=>a[0]===x&&a[1]===y)}
function move(dx,dy){if(!s||s.area==='house'&&s.x+dx<0)return;initAudio();let x=s.x+dx,y=s.y+dy;if(y<0||y>=H||x<0||x>=W||blocked(x,y)){sfx('step');return}s.x=x;s.y=y;sfx('step');let en=getEntities().find(e=>e.x===x&&e.y===y);if(en?.type==='exit'||en?.type==='gate'||en?.type==='door'){if(en.type==='door'){exitHouse();return}transition(en);return}if(s.area!=='town'&&s.area!=='house'&&Math.random()<.11&&!s.restored[s.area]){save();startBattle(false);return}if(en?.type==='sign')s.log=signAt(x,y)?.text||'立て札に道案内が書かれている。';else s.log=`${areaInfo[s.area].name}を歩いている。${en?en.name+'が近くに見える。':''}`;save();render()}
function tapTile(x,y){if(Math.abs(x-s.x)+Math.abs(y-s.y)===1)move(x-s.x,y-s.y);else if(x===s.x&&y===s.y)interact();else{s.log='一歩ずつ近づこう。';render()}}
function transition(e){if(e.type==='gate'&&s.area==='river'&&!s.restored.river){log('川の異変を鎮めると、港へ続く道が開きそうだ。');return}if(e.type==='gate'&&s.area==='port'&&!s.restored.port){log('網元が「網を救えば船を出せる」と言っている。');return}if(s.area==='town'&&e.name==='川辺へ')enterArea('river',[0,3]);else if(s.area==='river'&&e.name==='港へ')enterArea('port',[0,3]);else if(s.area==='river'&&e.x===0)enterArea('town',[7,3]);else if(s.area==='port'&&e.name==='沖へ')enterArea('sea',[0,3]);else if(s.area==='port'&&e.x===0)enterArea('river',[7,3]);else if(s.area==='sea'&&e.name==='星見の岬へ'){if(!s.restored.sea){log('星喰いを倒すと、星見の岬への光の道が現れる。');return}enterArea('cape',[1,3])}else if(s.area==='sea'&&e.x===0)enterArea('port',[7,3]);else if(s.area==='cape'&&e.name==='深海へ戻る')enterArea('sea',[6,3]);else if(s.area==='cape'&&e.type==='gate')enterArea('sea',[6,3]);else if(s.area==='house')exitHouse()}
function enterArea(a,pos){if(a==='port'&&!s.restored.river){log('川の水が戻るまで、港への道は濁流で通れない。');return}if(a==='sea'&&!s.restored.port){log('定置網を救うまで、船は沖へ出せない。');return}if(a==='cape'&&!s.ending){log('星見の岬へ続く道は、深海の異変を鎮めると現れる。');return}if(a==='cape'){for(let id of ids()){s.hp[id]=stats(id).hpmax;s.mp[id]=stats(id).mpmax;s.dead[id]=false}}s.area=a;s.x=pos[0];s.y=pos[1];if(!s.visited.includes(a))s.visited.push(a);s.log=areaInfo[a].intro;save();render();sfx('ok')}
function moveToHouse(){s.returnFrom={area:s.area,x:s.x,y:s.y};s.area='house';s.x=1;s.y=3;s.log=areaInfo.house.intro;render();sfx('door')}
function exitHouse(){if(!s.returnFrom){s.area='town';s.x=5;s.y=2}else{s.area=s.returnFrom.area;s.x=s.returnFrom.x;s.y=s.returnFrom.y;delete s.returnFrom}s.log='外へ出た。';save();render();sfx('door')}
function interact(){if(!s)return;initAudio();let arr=nearEntities();if(!arr.length){log('近くに調べるものはない。少し歩いてみよう。');return}let e=arr[0];switch(e.type){case'station':log('氷見駅前の立て札に「港・まちなか・山あいの川」とある。行ったことのある場所へは運賃を払って移動できる。');break;case'npc':talk(e);break;case'snack':snack();break;case'house':moveToHouse();break;case'shop':shopMenu();break;case'container':search(e);break;case'boss':if(s.restored[s.area])log('この場所には穏やかな潮風が吹いている。');else startBattle(true);break;case'exit':case'gate':transition(e);break;case'door':exitHouse();break;default:log('風が通り抜けた。')}}
function talk(e){let t='';if(s.postgameCleared&&s.area==='town'){t=e.name==='駅前の人'?'「深海に朝日が差したそうだね。氷見の海を救ってくれてありがとう。」':'「星見の岬の光を見たよ。港の魚たちも元気になった！」'}else if(s.postgameCleared&&s.area==='river'){t='「川の水が澄んで、海まできれいにつながった。岬の試練も越えたんだね！」'}else if(s.postgameCleared&&s.area==='port'){t='「網も海も戻って、沖に星の光が見える。みんなの記憶がつながったんだ。」'}else if(s.area==='town'){ t=e.name==='駅前の人'?'「この先の川が濁ってから、港の魚も姿を消したんだ。」':'「定置網が心配だ。スナック潮待ちに漁師が集まるよ。」'}else if(s.area==='river'){t=s.restored.river?'「水が澄んで小魚が帰ってきた。海までこの流れをつないでいこう。」':'「川の奥から濁った潮が押し返してくる。木のヌシが原因かもしれない。」'}else if(s.area==='port'){t=s.restored.port?'「網が直り、港に活気が戻った。船で沖へ向かえるぞ。」':'「夜のうちに大きな影が網を裂いた。網元のところへ行ってくれ。」'}else if(s.area==='sea'){t=s.restored.sea?'「星の光が海底に戻った。ありがとう。」':'「星喰いが海の記憶を飲み込んでいる。ここで止めよう。」'}else t='「この家は昔から川を見守っているんだ。」';if(e.name==='山の薬師'&&!s.unlocked.includes('herbalist')){s.unlocked.push('herbalist');t+=' ミツが仲間になった！'}if(e.name==='網元'&&s.restored.river&&!s.unlocked.includes('sailor')){s.unlocked.push('sailor');t+=' ゲンが仲間になった！'}if(e.name==='潮の精霊'){s.memory=Math.min(3,s.memory+1);t+=' ナギの記憶がよみがえった。「星の光は、海と山をつなぐ道しるべ……」'}log(t)}
function search(e){let key=s.area+':'+e.x+':'+e.y;if(s.finds[key]){log(`${e.name}をもう一度見た。中は空っぽだ。`);return}s.finds[key]=true;let n;if(e.name==='タンス'){s.items['氷見米のおにぎり']=(s.items['氷見米のおにぎり']||0)+1;n='タンスから氷見米のおにぎりを見つけた！'}else if(e.name==='壺'){s.gold+=12;n='壺の底から12Gを見つけた！'}else if(e.name==='本棚'){s.memory=Math.min(3,s.memory+1);n='古い航海日誌を見つけた。ナギの記憶が少しよみがえった。'}else{let item=s.area==='sea'?'あさつゆ貝':'里山野菜の煮物';s.items[item]=(s.items[item]||0)+1;n=`${e.name}の中から${item}を見つけた！`}log(n);sfx('ok')}
function snack(){let choices=Object.keys(people).filter(id=>s.unlocked.includes(id)&&!['nagi','toto'].includes(id));let recruit=Object.keys(people).filter(id=>!s.unlocked.includes(id)&&!['nagi','toto'].includes(id));openModal(`<h2>🏮 スナック潮待ち</h2><p>漁師や旅人が集まる、仲間と情報交換の場所。ナギとトトはいつも同行する。</p><div class="menu-list">${recruit.map(id=>`<button class="btn choice" onclick="window.recruit('${id}')">${people[id].icon} ${people[id].name}を仲間に誘う<span>${people[id].job}</span></button>`).join('')||'<p>新しく誘える仲間はいない。常連から地域のうわさを聞ける。</p>'}${choices.map(id=>`<button class="btn choice" onclick="window.setGuest('${id}')">${people[id].icon} ${people[id].name}<span>${s.guest===id?'同行中':'旅に誘う'}</span></button>`).join('')}<button class="btn" onclick="window.setGuest('')">仲間枠を空ける</button><button class="btn" onclick="window.closeModal()">店を出る</button></div>`)}
function recruit(id){if(!s.unlocked.includes(id))s.unlocked.push(id);s.guest=id;save();closeModal();sfx('ok');log(`${people[id].name}（${people[id].job}）が旅の仲間になった。職業はそのまま、いつでも交代できる。`)}
function partyMenu(){let opts=s.unlocked.filter(id=>!['nagi','toto'].includes(id));openModal(`<h2>仲間の編成</h2><p>主人公・ナギ・トトは固定。仲間枠は1人。仲間の職業は固定です。</p><div class="menu-list">${opts.map(id=>`<button class="btn choice" onclick="window.setGuest('${id}')">${people[id].icon} ${people[id].name}・${people[id].job}<span>${s.guest===id?'同行中':'交代する'}</span></button>`).join('')||'<p>スナック潮待ちで仲間を見つけよう。</p>'}<button class="btn" onclick="window.setGuest('')">仲間を連れずに進む</button><button class="btn" onclick="window.closeModal()">戻る</button></div>`)}
function setGuest(id){s.guest=id||null;save();closeModal();log(id?`${people[id].name}をパーティに加えた。`:'仲間枠を空けた。')}
function itemMenu(){openModal(`<h2>道具袋</h2><div class="menu-list">${Object.entries(s.items).filter(a=>a[1]>0).map(([n,c])=>`<button class="btn choice" onclick="window.useFood('${n}')">${n}<span>${c}個</span></button>`).join('')||'<p>食べ物は持っていない。</p>'}<button class="btn" onclick="window.closeModal()">戻る</button></div>`)}
function useFood(n){let f=foods.find(a=>a.n===n);if(!f||!s.items[n])return;if(f.all){ids().forEach(id=>s.hp[id]=Math.min(stats(id).hpmax,s.hp[id]+f.h))}else if(f.revive){let id=ids().find(x=>s.dead[x]||s.hp[x]<=0);if(!id){closeModal();log('復活が必要な仲間はいない。');return}s.dead[id]=false;s.hp[id]=Math.max(1,Math.ceil(stats(id).hpmax*.4))}else if(f.mp){let id=ids().find(x=>s.mp[x]<stats(x).mpmax);if(!id){closeModal();log('MPが減っている仲間はいない。');return}s.mp[id]=Math.min(stats(id).mpmax,s.mp[id]+f.mp)}else{let id=ids().find(x=>!s.dead[x]&&s.hp[x]<stats(x).hpmax);if(!id){closeModal();log('HPが減っている仲間はいない。');return}s.hp[id]=Math.min(stats(id).hpmax,s.hp[id]+f.h)}s.items[n]--;closeModal();sfx('heal');log(`${n}を食べて、仲間の力が戻った。`)}
function shopMenu(){let wc=weapons.filter(x=>!x.job||x.job==='all'||s.job===x.job||s.guest&&people[s.guest]?.job==='漁師');openModal(`<h2>🏪 道具・武器・防具屋</h2><p>所持金 ${s.gold}G　— 氷見の道具をそろえよう。</p><h3>食べ物・道具</h3><div class="menu-list">${foods.map(f=>`<button class="btn choice" onclick="window.buy('${f.n}')">${f.n}<span>${f.p}G · ${f.desc}</span></button>`).join('')}</div><div class="line"></div><h3>武器</h3><div class="menu-list">${wc.map(f=>`<button class="btn choice" onclick="window.buyGear('${f.n}','w',${f.p})">${f.n}<span>攻撃 +${f.a} · ${f.p}G</span></button>`).join('')}</div><div class="line"></div><h3>防具</h3><div class="menu-list">${armors.map(f=>`<button class="btn choice" onclick="window.buyGear('${f.n}','a',${f.p})">${f.n}<span>守備 +${f.d} · ${f.p}G</span></button>`).join('')}</div><button class="btn" style="width:100%;margin-top:9px" onclick="window.closeModal()">店を出る</button>`)}
function buy(n){let f=foods.find(x=>x.n===n);if(s.gold<f.p){log('お金が足りない。');return}s.gold-=f.p;s.items[n]=(s.items[n]||0)+1;save();sfx('coin');shopMenu()}
function buyGear(n,slot,p){if(s.gold<p){log('お金が足りない。');return}let who=ids()[0];let opts=ids().map(id=>`<button class="btn choice" onclick="window.equip('${n}','${slot}',${p},'${id}')">${stats(id).icon} ${stats(id).name}<span>装備する</span></button>`).join('');openModal(`<h2>${n}を買う</h2><p>価格 ${p}G　所持金 ${s.gold}G</p><div class="menu-list">${opts}<button class="btn" onclick="window.shopMenu()">戻る</button></div>`)}
function equip(n,slot,p,id){if(s.gold<p){shopMenu();return}s.gold-=p;s.gear[id][slot]=n;vital();save();sfx('coin');shopMenu()}
function travelMenu(){let destinations=s.visited.filter(a=>a!=='house'&&a!==s.area);let entries=destinations.map(a=>{let enabled=(a==='river'||a==='town'||s.restored.river&&a==='port'||s.restored.port&&a==='sea');return `<button class="btn choice" ${enabled?'':'disabled'} onclick="window.chooseTravel('${a}')">${areaInfo[a].art} ${areaInfo[a].name}<span>${enabled?'行き方を選ぶ':'まだ道が開いていない'}</span></button>`}).join('');openModal(`<h2>🚍 交通案内</h2><p>一度訪れた場所へは運賃を払ってすぐ移動できる。初めての道は歩いて発見しよう。</p>${entries||'<p>まだ移動先を見つけていない。まずは歩いてみよう。</p>'}<button class="btn" onclick="window.closeModal()">戻る</button>`)}
function chooseTravel(a){let sameTown=['town','river','port'].includes(a)&&['town','river','port'].includes(s.area);let options=[{n:'市街地周遊バス',p:8,ok:sameTown,desc:'安い・停留所間'},{n:'タクシー',p:30+10*Math.abs(s.visited.indexOf(a)-s.visited.indexOf(s.area)),ok:true,desc:'行ったことのある場所へ直行'},{n:'ヒミカ（4人乗り電動車）',p:20,ok:['town','port'].includes(a)&&['town','port'].includes(s.area),desc:'まちなかと港を巡る'}].filter(x=>x.ok);openModal(`<h2>${areaInfo[a].name}へ</h2><p>移動手段を選んでください。</p><div class="menu-list">${options.map(o=>`<button class="btn choice" onclick="window.travel('${a}','${o.n}',${o.p})">${o.n}<span>${o.p}G · ${o.desc}</span></button>`).join('')}<button class="btn" onclick="window.travelMenu()">行き先に戻る</button></div>`)}
function travel(a,n,p){if(s.gold<p){log('運賃が足りない。');return}s.gold-=p;s.area=a;s.x=0;s.y=3;closeModal();sfx('ok');log(`${n}に乗って${areaInfo[a].name}へ移動した。`)}
function menu(){openModal(`<h2>冒険メニュー</h2><div class="menu-list"><button class="btn" onclick="window.partyMenu()">仲間の編成</button><button class="btn" onclick="window.itemMenu()">食べ物・道具</button><button class="btn" onclick="window.travelMenu()">交通案内</button><button class="btn" onclick="window.memoryMenu()">冒険の記憶</button><button class="btn" onclick="window.saveNow()">セーブ</button><button class="btn" onclick="window.closeModal()">戻る</button></div>`)}
function memoryMenu(){openModal(`<h2>冒険の記憶</h2><p>川：${s.restored.river?'水が澄み、小魚が戻った':'濁った潮が流れ込んでいる'}<br>港：${s.restored.port?'網が直り、人の声が戻った':'定置網が裂けている'}<br>深海：${s.restored.sea?'星の光が戻った':'海の記憶が食べられている'}<br>思い出した記憶：${s.memory}/3</p><button class="btn" onclick="window.closeModal()">閉じる</button>`)}
function saveNow(){save();sfx('ok');log('冒険をセーブした。この端末で続きから再開できる。')}
function startBattle(isBoss){let id=s.area,b=isBoss?bossData[id]:null;if(isBoss&&!b)return;s.battle={boss:!!b,enemy:b?{...b,max:b.hp}:randomEnemy(),turn:'hero',msg:b?`${b.name}が立ちはだかった！`:'魔物があらわれた！'};renderBattle();sfx(isBoss?'boss':'hit')}
function randomEnemy(){let data={river:[['濁りコイ','🐟',30,9],['根っこ小鬼','🌱',34,10]],port:[['網ひっかき','🦀',42,12],['黒霧クラゲ','🪼',38,13]],sea:[['星くず魚','🐡',55,15],['無味の影','🌑',62,16]]}[s.area]||[['浜のカニ','🦀',24,7]];let e=data[Math.floor(Math.random()*data.length)];return {name:e[0],icon:e[1],hp:e[2],max:e[2],atk:e[3],xp:20,gold:10}}
function talkIwashin(){let avail=Object.keys(rewards).filter(a=>s.restored[a]&&!s.rewardClaimed?.[a]);openModal(`<div class="guide"><span class="fish">🐟</span><span><b>イワシん</b>「どうしたの？いっしょに考えよう！」</span></div><h2>イワシんと話す</h2><div class="menu-list"><button class="btn choice" onclick="window.chooseTalk('map')">この先の道を聞く<span>氷見の地図と道案内</span></button><button class="btn choice" onclick="window.chooseTalk('cheer')">仲間を応援してもらう<span>旅のヒントを聞く</span></button>${avail.map(a=>`<button class="btn choice" onclick="window.claimReward('${a}')">${a==='river'?'川のボス':a==='port'?'港のボス':a==='sea'?'深海のボス':'星見の岬の試練'}撃破のお礼を受け取る<span>武器・防具・アクセサリーから1つ</span></button>`).join('')||'<p>ボスを倒すと、イワシんから記念の品を選べるよ。</p>'}<button class="btn" onclick="window.closeModal()">またね</button></div>`)}
function chooseTalk(k){if(k==='map'){cityMap();return}openModal(`<div class="guide"><span class="fish">🐟</span><span><b>イワシん</b>「${s.postgameCleared?'星見の岬までありがとう！町へ戻ると、みんなの言葉も変わっているよ。':s.ending?'深海マップの東端に星見の岬への光の門が出たよ。歩いて近づいてみて！':s.restored.river?'川の水が戻ったね。港の網も助けてあげよう！':s.area==='town'?'駅前の看板を見てね。港や山あいへの道がわかるよ！':'仲間の作戦は戦闘中いつでも変えられるよ。回復が必要なら「いのちだいじに」！'}」</span></div><button class="btn" style="width:100%;margin-top:10px" onclick="window.talkIwashin()">話題を選ぶ</button>`)}
function claimReward(area){let options=rewards[area]||[];openModal(`<h2>🎁 イワシんからのお礼</h2><div class="guide"><span class="fish">🐟</span><span><b>イワシん</b>「地域を救ってくれてありがとう！ひとつ選んでね。」</span></div><p>選んだ品は主人公の装備になり、同じ地域の報酬は一度だけ受け取れます。</p><div class="menu-list">${options.map(o=>`<button class="btn choice" onclick="window.chooseReward('${area}','${o.slot}')">${o.slot==='w'?'⚔️ 武器':o.slot==='a'?'🛡️ 防具':'✨ アクセサリー'}：${o.n}<span>${o.slot==='w'?'攻撃 +'+o.a:'守備 +'+o.d}</span></button>`).join('')}<button class="btn" onclick="window.talkIwashin()">戻る</button></div>`)}
function chooseReward(area,slot){let item=rewards[area].find(x=>x.slot===slot);if(!item)return;s.gear.hero[slot]=item.n;s.rewardClaimed??={};s.rewardClaimed[area]=true;save();sfx('win');log(`イワシんから${item.n}をもらい、装備した！`)}
function renderBattle(){let b=s?.battle;if(!b){overlay.classList.add('hidden');overlay.innerHTML='';render();return}let e=b.enemy;openModal(`<div class="worldhead"><strong>${b.boss?'⚠️ ボス戦':'⚔️ 戦闘'}</strong><span>${areaInfo[s.area].name}</span></div><div class="guide"><span class="fish">🐟</span><span><b>イワシん</b>${b.boss?'ボスだよ！仲間の作戦を決めて、勝機をつかもう。':'作戦に合わせて仲間が自動で行動するよ。'}</span></div><div class="enemy"><div class="enemyone">${e.icon}<small>${e.name}</small><div class="bar enemyhp"><i style="width:${Math.max(0,e.hp/e.max*100)}%;background:#ff8b76"></i></div></div></div><div class="log">${esc(b.msg)}</div><div class="tacticbar">${[['allout','ガンガンいこうぜ'],['balanced','みんながんばれ'],['noMagic','じゅもんつかうな'],['careful','いのちだいじに']].map(([k,n])=>`<button class="btn ${s.tactic===k?'selected':''}" onclick="window.setTactic('${k}')">${n}</button>`).join('')}</div><div class="muted">作戦：${tacticName(s.tactic)}　主人公は手動操作</div><section class="party" style="margin:8px 0">${members()}</section><p>${b.turn==='hero'?`${esc(s.name)}はどうする？`:'仲間が行動中……'}</p>${b.turn==='hero'?`<div class="battle-actions"><button class="btn primary" onclick="window.battleAct('attack')">⚔ たたかう</button><button class="btn" onclick="window.spellMenu()">✨ 呪文・特技</button><button class="btn" onclick="window.itemMenu(true)">🍙 食べ物</button><button class="btn" onclick="window.battleAct('defend')">🛡 ぼうぎょ</button></div>`:''}`)}
function tacticName(k){return ({allout:'ガンガンいこうぜ',balanced:'みんながんばれ',noMagic:'じゅもんつかうな',careful:'いのちだいじに'})[k]||'みんながんばれ'}
function setTactic(k){s.tactic=k;save();renderBattle()}
function roundAfterHero(){let b=s.battle,e=b.enemy,notes=[];for(let id of ids().filter(id=>id!=='hero'&&!s.dead[id]&&s.hp[id]>0)){if(e.hp<=0)break;let a=stats(id),low=ids().filter(v=>!s.dead[v]&&s.hp[v]>0&&s.hp[v]/stats(v).hpmax<.42).sort((x,y)=>s.hp[x]/stats(x).hpmax-s.hp[y]/stats(y).hpmax)[0];if(s.tactic==='careful'&&id==='nagi'&&low&&s.mp[id]>=5){s.mp[id]-=5;s.hp[low]=Math.min(stats(low).hpmax,s.hp[low]+20);notes.push(`${a.name}のいやしの水！${stats(low).name}を回復。`);continue}if(s.tactic==='balanced'&&id==='nagi'&&low&&s.hp[low]<stats(low).hpmax*.3&&s.mp[id]>=5){s.mp[id]-=5;s.hp[low]=Math.min(stats(low).hpmax,s.hp[low]+20);notes.push(`${a.name}がいやしの水で${stats(low).name}を回復。`);continue}if(s.tactic!=='noMagic'&&id==='toto'&&s.mp[id]>=4&&(s.tactic==='allout'||e.hp>20)){s.mp[id]-=4;let d=12+Math.floor(s.lv*1.3);e.hp-=d;notes.push(`${a.name}の波しぶき！${d}ダメージ。`);continue}let d=Math.max(1,a.atk+Math.floor(Math.random()*5)-Math.floor((e.def||2)*.4));e.hp-=d;notes.push(`${a.name}の攻撃、${d}ダメージ。`)}b.msg+=' '+notes.join(' ');if(e.hp<=0){victory();return}enemyTurn()}
function battleAct(k){let b=s?.battle;if(!b){renderBattle();return}let e=b.enemy,hero=stats('hero');if(k==='attack'){let d=Math.max(1,hero.atk+Math.floor(Math.random()*6)-Math.floor(e.def||2));e.hp-=d;b.msg=`${s.name}の攻撃！ ${e.name}に${d}ダメージ。`}else{b.msg=`${s.name}は身を守っている。`;s.guard=true}if(e.hp<=0){victory();return}roundAfterHero()}
function enemyTurn(){let b=s.battle;if(!b)return;let e=b.enemy,alive=ids().filter(id=>!s.dead[id]&&s.hp[id]>0);if(!alive.length){wipeBattle();return}let t=alive[Math.floor(Math.random()*alive.length)],d=Math.max(2,e.atk-Math.floor(stats(t).def*.45)-(s.guard?5:0)+Math.floor(Math.random()*4));s.hp[t]-=d;s.guard=false;if(s.hp[t]<=0){s.hp[t]=0;s.dead[t]=true}b.msg+=` ${e.name}の反撃！ ${stats(t).name}に${d}ダメージ。`;b.turn='hero';save();renderBattle();sfx('hit')}
function spellMenu(){if(!s?.battle){renderBattle();return}let known=spells.filter(x=>x.unlock<=(s.restored.port?2:s.restored.river?1:0));openModal(`<h2>呪文・特技</h2><div class="menu-list">${known.map(sp=>`<button class="btn choice" onclick="window.cast('${sp.n}')">${sp.n}<span>MP ${sp.cost} · ${sp.desc}</span></button>`).join('')}<button class="btn" onclick="window.renderBattle()">戻る</button></div>`)}
function cast(n){if(!s?.battle){renderBattle();return}let sp=spells.find(x=>x.n===n);if(!sp||s.mp.hero<sp.cost){s.battle.msg='MPが足りない。';renderBattle();return}s.mp.hero-=sp.cost;let e=s.battle.enemy;if(sp.type==='healAll'){ids().forEach(id=>s.hp[id]=Math.min(stats(id).hpmax,s.hp[id]+sp.d));s.battle.msg=`${sp.n}！みんなのHPが回復した。`}else{let d=sp.d+Math.floor(s.lv*1.5);e.hp-=d;s.battle.msg=`${sp.n}！${e.name}に${d}ダメージ。`}overlay.classList.add('hidden');if(e.hp<=0)victory();else roundAfterHero()}
function victory(){let b=s?.battle;if(!b)return;let e=b.enemy;delete s.battle;s.wins++;s.gold+=e.gold||8;s.xp+=e.xp||15;let text=`${e.name}をたおした！ ${e.gold||8}Gを手に入れた。`;if(b.boss){s.restored[s.area]=true;s.memory=Math.min(3,s.memory+1);s.items['寒ブリのあら汁']=(s.items['寒ブリのあら汁']||0)+1;text+=` ${bossData[s.area].restore} 記憶のかけらを思い出した！`;if(s.area==='river'&&!s.unlocked.includes('herbalist'))s.unlocked.push('herbalist');if(s.area==='port'&&!s.unlocked.includes('sailor'))s.unlocked.push('sailor');if(s.area==='sea')s.ending=true;if(s.area==='cape')s.postgameCleared=true}else if(Math.random()<.22){let f=foods[Math.floor(Math.random()*3)];s.items[f.n]=(s.items[f.n]||0)+1;text+=` ${f.n}を見つけた！`}while(s.xp>=s.lv*45){s.xp-=s.lv*45;s.lv++;text+=` レベル${s.lv}に上がった！`}for(let id of ids()){s.hp[id]=Math.min(stats(id).hpmax,s.hp[id]||stats(id).hpmax);s.dead[id]=false}sfx('win');save();if(s.postgameCleared){render();postgameEndingModal(text)}else if(s.ending){render();endingModal(text)}else openModal(`<div class="ending"><div style="font-size:48px">🎉</div><h2>戦闘に勝利！</h2><p>${esc(text)}</p><p>Lv.${s.lv}　${s.gold}G</p><button class="btn primary" style="width:100%" onclick="window.closeModal()">フィールドへ戻る</button></div>`)}
function endingModal(t){openModal(`<div class="ending"><div style="font-size:58px">🌊✨</div><h1>氷見の海に、記憶が戻った</h1><p>${t}</p><p>仲間と歩いた川、港、深海。救った地域：3/3<br>戦い：${s.wins}回　思い出した記憶：${s.memory}/3</p><div class="guide"><span class="fish">🐟</span><span><b>イワシん</b>「冒険はまだ続くよ！深海マップの東端に現れた光の門から、星見の岬へ行ってみよう。」</span></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="window.closeModal()">クリア後の冒険へ</button></div>`)}
function postgameEndingModal(t){openModal(`<div class="ending"><div style="font-size:58px">🌅✨</div><h1>星見の岬の試練を達成！</h1><p>${esc(t)}</p><p>氷見の海と岬に、すべての記憶が戻った。</p><div class="guide"><span class="fish">🐟</span><span><b>イワシん</b>「町へ戻ってみよう。川・港・駅前の人たちの言葉が変わっているよ。選んだごほうびも受け取ってね！」</span></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="window.closeModal()">町や仲間を見に行く</button></div>`)}
function wipeBattle(){delete s.battle;s.gold=Math.floor(s.gold*.9);ids().forEach(id=>{s.dead[id]=false;s.hp[id]=Math.max(1,Math.floor(stats(id).hpmax*.35));s.mp[id]=Math.floor(stats(id).mpmax*.35)});s.area='town';s.x=0;s.y=3;save();sfx('hit');log('力尽きた。潮守りの社へ運ばれ、所持金の一部を失った。食べ物と経験値は残った。')}
function useFood(n,inBattle=false){let f=foods.find(x=>x.n===n);if(!f||!s.items[n])return;if(f.all)ids().forEach(id=>s.hp[id]=Math.min(stats(id).hpmax,s.hp[id]+f.h));else if(f.revive){let id=ids().find(x=>s.dead[x]);if(!id){openModal('<h2>使える相手がいない</h2><button class="btn" onclick="window.itemMenu()">戻る</button>');return}s.dead[id]=false;s.hp[id]=Math.ceil(stats(id).hpmax*.4)}else if(f.mp){let id=ids().find(x=>s.mp[x]<stats(x).mpmax);if(!id){s.log='MPが減っている仲間はいない。'}else s.mp[id]=Math.min(stats(id).mpmax,s.mp[id]+f.mp)}else{let id=ids().find(x=>s.hp[x]<stats(x).hpmax&&!s.dead[x]);if(id)s.hp[id]=Math.min(stats(id).hpmax,s.hp[id]+f.h);else s.log='HPが減っている仲間はいない。'}s.items[n]--;save();sfx('heal');if(inBattle&&s.battle){s.battle.msg=`${n}を使った。`;roundAfterHero()}else{closeModal();log(`${n}を食べた。`)} }
function itemMenu(inBattle=false){if(inBattle&&!s?.battle)inBattle=false;openModal(`<h2>🍱 食べ物・道具</h2><div class="menu-list">${Object.entries(s.items).filter(x=>x[1]>0).map(([n,c])=>`<button class="btn choice" onclick="window.useFood('${n}',${!!inBattle})">${n}<span>${c}個</span></button>`).join('')||'<p>道具がない。</p>'}<button class="btn" onclick="${inBattle?'window.renderBattle()':'window.closeModal()'}">戻る</button></div>`)}
function toggleSound(){initAudio();music=!music;if(audio){if(music)startMusic();else clearInterval(audio.m)}render();sfx('ok')}
function memoryMenu(){openModal(`<h2>冒険の記憶</h2><p>山あいの川：${s.restored.river?'水が澄み、小魚が戻った':'濁った潮に覆われている'}<br>氷見漁港：${s.restored.port?'網が直り、港に活気が戻った':'定置網が裂けている'}<br>深海：${s.restored.sea?'星の光が戻った':'海の記憶が消えつつある'}<br>思い出した記憶 ${s.memory}/3</p><button class="btn" onclick="window.closeModal()">閉じる</button>`)}
function travelMenu(){let places=s.visited.filter(a=>a!=='house'&&a!==s.area&&(a!=='cape'||s.ending));openModal(`<h2>🚌 交通案内</h2><p>訪れた場所へは運賃を払ってすぐ移動できる。</p>${places.map(a=>`<div class="card" style="margin:6px 0"><b>${areaInfo[a].art} ${areaInfo[a].name}</b><div class="row" style="margin-top:6px"><button class="btn" onclick="window.travel('${a}','バス',8)">バス 8G</button><button class="btn" onclick="window.travel('${a}','タクシー',30)">タクシー 30G</button>${['town','port'].includes(a)&&['town','port'].includes(s.area)?`<button class="btn" onclick="window.travel('${a}','ヒミカ',18)">ヒミカ 18G</button>`:''}</div></div>`).join('')||'<p>行き先を見つけるには、まず歩いてみよう。</p>'}<button class="btn" onclick="window.closeModal()">戻る</button>`)}
function travel(a,n,p){if(s.gold<p){log('運賃が足りない。');return}s.gold-=p;s.area=a;s.x=maps[a].spawn[0];s.y=maps[a].spawn[1];closeModal();sfx('ok');log(`${n}に乗って${areaInfo[a].name}へ移動した。`)}
function menu(){openModal(`<h2>冒険メニュー</h2><div class="menu-list"><button class="btn" onclick="window.partyMenu()">仲間の編成</button><button class="btn" onclick="window.itemMenu()">食べ物・道具</button><button class="btn" onclick="window.travelMenu()">運賃で移動</button><button class="btn" onclick="window.memoryMenu()">地域と記憶</button><button class="btn" onclick="window.closeModal()">戻る</button></div><p class="muted">セーブデータはこの端末・ブラウザ内に保存されます。</p>`)}
function saveNow(){save();sfx('ok');log('冒険をセーブした。')}
window.move=move;window.tapTile=tapTile;window.interact=interact;window.newGame=newGame;window.startNew=startNew;window.continueGame=continueGame;window.closeModal=closeModal;window.toggleSound=toggleSound;window.menu=menu;window.partyMenu=partyMenu;window.setGuest=setGuest;window.recruit=recruit;window.itemMenu=itemMenu;window.useFood=useFood;window.shopMenu=shopMenu;window.buy=buy;window.buyGear=buyGear;window.equip=equip;window.travelMenu=travelMenu;window.chooseTravel=chooseTravel;window.travel=travel;window.saveNow=saveNow;window.memoryMenu=memoryMenu;window.battleAct=battleAct;window.spellMenu=spellMenu;window.cast=cast;window.renderBattle=renderBattle;window.cityMap=cityMap;window.cityPlace=cityPlace;window.setTactic=setTactic;window.talkIwashin=talkIwashin;window.claimReward=claimReward;window.chooseReward=chooseReward;window.chooseTalk=chooseTalk;
try{s=load();if(s){s.area=s.area||'town';s.visited||=['town'];s.restored||={river:false,port:false,sea:false,cape:false};s.restored.cape??=false;s.postgameCleared??=false;if(s.restored.sea)s.ending=true;s.tactic||='balanced';vital();render()}else title()}catch(e){app.innerHTML=`<section class="card"><h2>ゲームの起動に失敗しました</h2><p>${esc(e&&e.stack||e)}</p></section>`}
})();
</script></body></html>
