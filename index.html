<script>
(()=>{
const SAVE='himiRpgSave_v1';
const chapters=[
 {place:'氷見の港',title:'魚のいない朝',art:'🌊',intro:'港から魚の姿が消えた。魚を食べた記憶まで薄れていくなか、魚の精霊トトが現れる。「六つの潮のしるしを集めて、星の底へ向かおう」',boss:'潮よどみのヌシ',bossArt:'🦑',villain:'海底の洞窟に、黒い霧を吐くヌシがいる。浜の人たちを助け、潮のしるしを取り戻そう。'},
 {place:'山あいの川辺',title:'山から流れるもの',art:'🌲',intro:'山の水が濁り、川の流れも乱れている。海の異変は、浜だけで起きているのではなかった。',boss:'濁流の大樹',bossArt:'🌳',villain:'川の奥で、根を広げる大樹の魔物が水をせき止めている。'},
 {place:'火守りの工房',title:'火の工房',art:'🔥',intro:'魚を焼いても味がしない。職人は火加減と工夫で、魚のおいしさを守ろうとしていた。ナギは小さなひとかけらを口にする。',boss:'灰かぶりの鬼',bossArt:'👹',villain:'工房の炉に巣食う鬼が、香りと味を吸い取っている。'},
 {place:'氷見の市場',title:'消えた市場',art:'🐟',intro:'市場から魚も人の声も消えかけている。獲る人、加工する人、届ける人。食卓までの道をたどろう。',boss:'値札の亡霊',bossArt:'👻',villain:'市場の地下迷宮で、魚の価値を数字だけに変える亡霊が待つ。'},
 {place:'魚ぎらいの町',title:'好き嫌いの王',art:'🏘️',intro:'魚が苦手な子どもたちに、大人は「食べなさい」と言う。ナギは「どこが苦手？」と尋ね、みんなの声を聞き始める。',boss:'好き嫌いの王',bossArt:'🦀',villain:'町の広場に、子どもを責める心から生まれた王が現れた。'},
 {place:'星見の浜',title:'形のちがう魚たち',art:'✨',intro:'姿の不ぞろいな魚が捨てられている。工房の人たちは新しい食べ方を考え、海の恵みを別の形で届けていた。',boss:'選別の巨人',bossArt:'🗿',villain:'星の門を守る巨人は、形のちがうものをすべて消そうとする。'},
 {place:'星の底',title:'星喰い',art:'🌌',intro:'星喰いは、違いも記憶もない均一な海を作ろうとしていた。けれど、違いがあるから工夫が生まれ、食べ方を選べる。旅で出会った人々の思いを胸に、最後の戦いへ。',boss:'星喰い・均一なる海',bossArt:'🌑',villain:'海の色も味も消す星喰い。仲間と潮のしるしを信じて立ち向かおう。'}
];
const jobs={
 fighter:{name:'浜の剣士',icon:'⚔️',hp:48,mp:12,atk:12,def:9,spd:7,skill:'潮斬り',cost:3,kind:'attack',desc:'敵1体に強い斬撃'},
 tide:{name:'潮読み',icon:'🔱',hp:34,mp:24,atk:7,def:6,spd:9,skill:'潮の矢',cost:4,kind:'magic',desc:'潮の魔法で敵を攻撃'},
 guardian:{name:'海守り',icon:'🛡️',hp:55,mp:15,atk:8,def:12,spd:5,skill:'守りの潮',cost:4,kind:'guard',desc:'味方全員の守備力アップ'},
 fisher:{name:'漁師',icon:'🎣',hp:42,mp:14,atk:10,def:7,spd:11,skill:'網投げ',cost:3,kind:'all',desc:'敵全体に網を投げる'},
 artisan:{name:'火守り職人',icon:'🔥',hp:38,mp:20,atk:8,def:7,spd:7,skill:'炎あぶり',cost:4,kind:'magic',desc:'火の技で敵を攻撃'},
 merchant:{name:'市場の目利き',icon:'🪙',hp:40,mp:17,atk:8,def:7,spd:10,skill:'弱点見切り',cost:3,kind:'debuff',desc:'敵の守りを下げる'}
};
const roster={nagi:{name:'ナギ',job:'海守り',icon:'🧒',base:'guardian',hp:40,mp:24,atk:7,def:8,spd:7,skills:['いやしの水','応援']},toto:{name:'トト',job:'海の精霊',icon:'🐟',base:'tide',hp:32,mp:28,atk:6,def:5,spd:10,skills:['波しぶき','魚群突撃']},fisher:{name:'ソウタ',job:'漁師',icon:'🎣',base:'fisher',hp:43,mp:12,atk:11,def:7,spd:10,skills:['網投げ','弱点見切り']},herbalist:{name:'ミツ',job:'山の薬師',icon:'🌿',base:'guardian',hp:39,mp:24,atk:6,def:7,spd:8,skills:['いやしの水','毒消し草']},artisan:{name:'カナエ',job:'火守り職人',icon:'🔥',base:'artisan',hp:38,mp:18,atk:9,def:7,spd:7,skills:['炎あぶり','活力だれ']},shipwright:{name:'ゲン',job:'海守り',icon:'🛡️',base:'guardian',hp:55,mp:13,atk:9,def:12,spd:5,skills:['かばう','守りの潮']},merchant:{name:'ユキ',job:'市場の目利き',icon:'🪙',base:'merchant',hp:38,mp:18,atk:8,def:7,spd:10,skills:['弱点見切り','お宝の目']}};
const enemies=[
 [{name:'黒霧クラゲ',icon:'🪼',hp:25,atk:7,def:2,xp:13,gold:8},{name:'浜のカニ',icon:'🦀',hp:30,atk:8,def:3,xp:15,gold:10}],
 [{name:'濁りコイ',icon:'🐠',hp:39,atk:11,def:4,xp:22,gold:12},{name:'根っこ小鬼',icon:'🌱',hp:34,atk:10,def:5,xp:20,gold:12}],
 [{name:'灰ぼこり',icon:'🌫️',hp:45,atk:13,def:5,xp:29,gold:15},{name:'炉の小鬼',icon:'👺',hp:42,atk:14,def:4,xp:30,gold:16}],
 [{name:'値札コウモリ',icon:'🦇',hp:50,atk:15,def:5,xp:36,gold:18},{name:'迷子の魚影',icon:'🐟',hp:55,atk:14,def:6,xp:38,gold:20}],
 [{name:'しかり虫',icon:'🐛',hp:62,atk:17,def:7,xp:45,gold:22},{name:'かたくな貝',icon:'🐚',hp:70,atk:16,def:9,xp:47,gold:22}],
 [{name:'星くず魚',icon:'🐡',hp:74,atk:20,def:8,xp:56,gold:28},{name:'選別ゴーレム',icon:'🪨',hp:82,atk:19,def:10,xp:59,gold:30}],
 [{name:'無味の影',icon:'🌑',hp:92,atk:22,def:10,xp:70,gold:35},{name:'星の番人',icon:'👁️',hp:105,atk:21,def:12,xp:75,gold:38}]
];
const drops=[['浜のおにぎり',.20],['あさつゆ貝',.07],['潮のかけら',.12]];
const shopGoods={
 tools:[{name:'浜のおにぎり',price:18,desc:'HPを32回復'},{name:'あさつゆ貝',price:60,desc:'戦闘不能の仲間を復活'},{name:'潮のかけら',price:35,desc:'MPを12回復'}],
 weapons:[{name:'潮風の短剣',price:55,stat:3,minStage:0,desc:'攻撃力 +3'},{name:'火守りの銛',price:125,stat:6,minStage:2,desc:'攻撃力 +6'},{name:'星潮の剣',price:280,stat:10,minStage:5,desc:'攻撃力 +10'}],
 armor:[{name:'漁師の胴衣',price:45,stat:2,minStage:0,desc:'守備力 +2'},{name:'魚鱗のよろい',price:130,stat:5,minStage:2,desc:'守備力 +5'},{name:'潮守りの鎧',price:260,stat:9,minStage:5,desc:'守備力 +9'}]
};
let s=load()||null, audio=null, musicOn=true, textOn=true, typingTimer=null;
const app=document.querySelector('#app'), overlay=document.querySelector('#overlay');
function fresh(job='fighter',name='ユウ'){return {name,job,lv:1,xp:0,gold:100,stage:0,progress:0,unlocked:['nagi','toto'],guest:null,activeGuest:null,items:{'浜のおにぎり':3,'あさつゆ貝':1,'潮のかけら':1},equipment:{hero:{weapon:'',armor:''},nagi:{weapon:'',armor:''},toto:{weapon:'',armor:''}},hp:{},mp:{},dead:{},flags:{intro:false,ending:false,post:false},log:'港に朝の光が差した。冒険の始まりだ。',wins:0}}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE));return x&&x.ver===1?x.state:null}catch{return null}}
function save(){if(!s)return;localStorage.setItem(SAVE,JSON.stringify({ver:1,state:s}));}
function stats(id){const eq=s.equipment?.[id]||{},weapon=shopGoods.weapons.find(x=>x.name===eq.weapon),armor=shopGoods.armor.find(x=>x.name===eq.armor);if(id==='hero'){const j=jobs[s.job],n=s.lv-1;return {name:s.name,job:j.name,icon:j.icon,hpmax:j.hp+n*(j.hp>45?6:4),mpmax:j.mp+n*3,atk:j.atk+n*2+(weapon?.stat||0),def:j.def+n+(armor?.stat||0),spd:j.spd+n,skills:[j.skill]}}const c=roster[id],n=s.lv-1;return {...c,hpmax:c.hp+n*4,mpmax:c.mp+n*2,atk:c.atk+n+(weapon?.stat||0),def:c.def+n+(armor?.stat||0),spd:c.spd+n*.5}}
function ids(){return ['hero','nagi','toto',...(s.activeGuest?[s.activeGuest]:[])].filter(id=>id==='hero'||s.unlocked.includes(id))}
function ensureVitals(){s.equipment=s.equipment||{};for(const id of ['hero',...s.unlocked]){s.equipment[id]=s.equipment[id]||{weapon:'',armor:''};const a=stats(id);if(s.hp[id]==null)s.hp[id]=a.hpmax;if(s.mp[id]==null)s.mp[id]=a.mpmax;s.hp[id]=Math.min(a.hpmax,s.hp[id]);s.mp[id]=Math.min(a.mpmax,s.mp[id])}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;const ctx=new C(),master=ctx.createGain();master.gain.value=.22;master.connect(ctx.destination);audio={ctx,master,seq:0,music:null}}if(audio.ctx.state==='suspended')audio.ctx.resume().then(()=>{if(musicOn)startMusic()}).catch(()=>{});if(musicOn&&!audio.music)startMusic();return true}catch{return false}}
function tone(freq,dur=.08,wave='square',vol=.35,delay=0){if(!audio)return;const {ctx,master}=audio,t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=wave;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur)}
function sfx(type='tap'){if(!audio||!musicOn)return;const map={tap:[540,.06,'square',.38],ok:[740,.11,'triangle',.42],hit:[150,.16,'sawtooth',.48],heal:[820,.20,'sine',.42],crit:[900,.20,'square',.42],win:[660,.18,'triangle',.42],text:[420,.035,'square',.34],error:[200,.16,'square',.4]};const q=map[type]||map.tap;tone(...q)}
function startMusic(){if(!audio||!musicOn)return;clearInterval(audio.music);let i=0;const seq=[392,0,494,587,0,494,440,0,330,392,0,440,494,0,440,392];audio.music=setInterval(()=>{if(!musicOn||!audio||audio.ctx.state!=='running')return;let n=seq[i++%seq.length];if(n)tone(n,.22,'triangle',.18);if(i%4===0)tone(196,.34,'sine',.10)},260)}
function stopMusic(){if(audio?.music)clearInterval(audio.music)}
function say(text,onDone){clearInterval(typingTimer);let out='',i=0;const node=document.querySelector('#narration');if(!node)return;node.textContent='';const arr=[...text];typingTimer=setInterval(()=>{if(i>=arr.length){clearInterval(typingTimer);if(onDone)node.dataset.done='1';return}out+=arr[i++];node.textContent=out;if(textOn&&i%2===0)sfx('text')},26);node.onclick=()=>{if(typingTimer){clearInterval(typingTimer);node.textContent=text;typingTimer=null;if(onDone)node.dataset.done='1'}}}
function statCard(id){const a=stats(id),h=s.hp[id]??a.hpmax,m=s.mp[id]??a.mpmax,down=(s.dead[id]||h<=0),eq=s.equipment?.[id]||{};return `<div class="member"><div class="name">${a.icon} ${esc(a.name)}${down?' 💫':''}</div><div class="job">${a.job} Lv.${s.lv}<br><span class="muted">⚔ ${eq.weapon||'なし'}　🛡 ${eq.armor||'なし'}</span></div><div class="bar"><i style="width:${Math.max(0,h/a.hpmax*100)}%"></i></div><div class="nums"><span>HP ${Math.max(0,h)}/${a.hpmax}</span></div><div class="bar mp"><i style="width:${Math.max(0,m/a.mpmax*100)}%"></i></div><div class="nums"><span>MP ${Math.max(0,m)}/${a.mpmax}</span></div></div>`}
function render(){if(!s){title();return}ensureVitals();const c=chapters[s.stage],battle=s.battle,post=s.flags.post||0;const postText=post===1?'氷見の海に魚が戻った。ナギは魚を何でも食べられるようになったわけではない。それでも自分に合う食べ方を見つけ、子どもたちと一緒に新しい食べ方を考え始めた。浜に流れ着いた星のかけらが、まだ見ぬ海の記憶を映している。':post===2?'星のかけらに残っていたのは、誰にも気づかれず消えた小さな約束。海の底で、その約束が魔物の姿をとった。':'ナギは子どもたちに「どこが苦手？」と尋ね、一緒に新しい食べ方を考え始めた。夜明けの海に星がひとつ沈み、主人公たちは次の冒険へ歩き出す。';const place=post?'氷見の港':c.place,titleText=post?(post===1?'もうひとつの潮':post===2?'忘れられた約束':'星が沈む夜明け'):c.title,art=post?(post===1?'🌠':post===2?'🌊✨':'🌅'):c.art;app.innerHTML=`<header class="top"><div class="brand">氷見の海と、星を食べるもの<small>HIMI SEA TALES · RPG</small></div><div class="tools"><button class="icon" data-sound-toggle onclick="window.soundToggle()" aria-label="音設定">${musicOn?'🔊':'🔇'} 音 ${musicOn?'ON':'OFF'}</button><button class="icon" onclick="window.menu()">☰</button></div></header><section class="card hero"><div class="location">${battle?'⚔️ ENCOUNTER':`📍 ${place}　・　${post?'クリア後の物語':`${'●'.repeat(Math.min(s.progress,2))}${'○'.repeat(2-Math.min(s.progress,2))}`}`}</div><div class="scene-title">${battle?'戦闘中':titleText}</div><div class="scene-art">${battle?battle.enemies.map(e=>e.icon).join('　'):art}</div><div class="narration type" id="narration">${esc(battle?battle.message:(post?postText:(s.log||c.intro)))}</div></section>${battle?battleUI():`<section class="party">${ids().map(statCard).join('')}</section><div class="battle-log" id="log">${esc(s.log||c.intro)}</div><section class="actions">${post===1?`<button class="btn primary" onclick="window.postExplore()">🌠 星のかけらを調べる</button>`:post===2?`<button class="btn primary" onclick="window.postBoss()">🌊 忘れられた約束と戦う</button>`:post===3?`<button class="btn primary" onclick="window.recap()">📖 冒険を振り返る</button>`:s.progress<2?`<button class="btn primary" onclick="window.explore()">🧭 探索する</button>`:`<button class="btn primary" onclick="window.boss()">🌊 奥へ進む</button>`}<button class="btn" onclick="window.partyMenu()">👥 仲間を編成</button><button class="btn" onclick="window.itemMenu()">🎒 道具・回復</button><button class="btn" onclick="window.shrine()">⛩ 潮守りの社</button><button class="btn" onclick="window.shopHome()">🏪 道具・武器・防具屋</button></section>`}<footer class="footer"><span>Lv.${s.lv}　所持金 ${s.gold}G</span><span>${post?'クリア後':`潮のしるし ${s.stage}/6`}</span><button class="icon" onclick="window.saveNow()">💾 セーブ</button></footer>`;if(!battle){const text=post?postText:(s.log||c.intro);say(text)}}
function battleUI(){let b=s.battle,actor=b.order[b.turn],a=stats(actor),down=s.dead[actor]||s.hp[actor]<=0;let living=b.enemies.filter(e=>e.hp>0);return `<section class="enemy">${living.map(e=>`<div class="enemyone">${e.icon}<small>${esc(e.name)}</small><div class="bar enemyhp"><i style="width:${Math.max(0,e.hp/e.max*100)}%;background:#ff8b76"></i></div></div>`).join('')}</section><section class="party">${ids().map(statCard).join('')}</section><div class="battle-log">${esc(b.message||`${a.name}はどうする？`)}</div><section class="actions">${down?`<button class="btn" disabled>戦闘不能</button>`:`<button class="btn primary" onclick="window.act('attack')">⚔️ たたかう</button><button class="btn" onclick="window.act('skill')">✨ ${esc(a.skills?.[0]||jobs[s.job].skill)}</button><button class="btn" onclick="window.act('defend')">🛡️ ぼうぎょ</button><button class="btn" onclick="window.itemMenu(true)">🎒 道具</button>`}</section>`}
function title(){app.innerHTML=`<header class="top"><div class="brand">中村海産 presents<small>HIMI SEA TALES</small></div><button class="icon" data-sound-toggle onclick="window.soundToggle()">${musicOn?'🔊':'🔇'} 音 ${musicOn?'ON':'OFF'}</button></header><section class="card hero" style="min-height:36dvh;justify-content:center;text-align:center"><div class="scene-art" style="font-size:88px">🌊🐟✨</div><div class="scene-title">氷見の海と、<br>星を食べるもの</div><div class="narration">海の記憶を取り戻す冒険へ。</div></section><section class="card"><div style="font-size:14px;line-height:1.8">魚の姿が消え始めた氷見。<br>ナギとトトと一緒に、海の異変を追いかけよう。</div><div class="modal-actions">${load()?'<button class="btn primary" onclick="window.continueGame()">▶ つづきから</button>':''}<button class="btn" onclick="window.newGame()">🌟 はじめから</button></div></section><div class="footer"><span>スマホ対応・自動セーブ</span><span>画面をタップして音を有効にできます</span></div>`}

function setGuest(id){s.activeGuest=id||null;save();closeModal();render();sfx('ok')}
function itemMenu(inBattle=false){if(!s)return;const list=Object.entries(s.items).filter(([,n])=>n>0);showModal(`<h2>道具袋</h2><div class="menu-list">${list.map(([name,n])=>`<button class="btn choice" onclick="window.useItem('${name.replaceAll("'","\\'")}',${inBattle})">${name}<span>${n}個　${name==='あさつゆ貝'?'戦闘不能を復活':name==='潮のかけら'?'MPを回復':'HPを回復'}</span></button>`).join('')||'<p>道具を持っていない。</p>'}<button class="btn" onclick="window.closeModal()">戻る</button></div>`)}
function useItem(name,inBattle=false){const n=s.items[name]||0;if(!n){closeModal();return}let targets=ids().filter(id=>id==='hero'||s.unlocked.includes(id));let target=targets.find(id=>name==='あさつゆ貝'?(s.dead[id]||s.hp[id]<=0):(!s.dead[id]&&s.hp[id]>0));if(name==='浜のおにぎり')target=targets.find(id=>!s.dead[id]&&s.hp[id]>0&&s.hp[id]<stats(id).hpmax);if(name==='潮のかけら')target=targets.find(id=>!s.dead[id]&&s.mp[id]<stats(id).mpmax);if(!target){s.log='使える仲間がいない。';closeModal();render();sfx('error');return}s.items[name]--;if(name==='あさつゆ貝'){s.dead[target]=false;s.hp[target]=Math.ceil(stats(target).hpmax*.35);s.log=`${stats(target).name}は息を吹き返した！`;sfx('heal')}else if(name==='浜のおにぎり'){s.hp[target]=Math.min(stats(target).hpmax,s.hp[target]+32);s.log=`${stats(target).name}のHPが回復した。`;sfx('heal')}else{s.mp[target]=Math.min(stats(target).mpmax,s.mp[target]+12);s.log=`${stats(target).name}のMPが回復した。`;sfx('heal')}closeModal();if(inBattle){s.battle.message=s.log;render()}else{save();render()}}
let shopMessage='';
function shopHome(){if(!s)return;initAudio();shopMessage='';showModal(`<h2>潮風の店</h2><p>所持金：<strong>${s.gold} G</strong><br>旅の商人が、冒険に役立つ品をそろえている。</p><div class="menu-list"><button class="btn" onclick="window.shopCategory('tools')">🧺 道具屋</button><button class="btn" onclick="window.shopCategory('weapons')">⚔️ 武器屋</button><button class="btn" onclick="window.shopCategory('armor')">🛡️ 防具屋</button><button class="btn" onclick="window.closeModal()">店を出る</button></div>`)}
function shopCategory(type){const title={tools:'道具屋',weapons:'武器屋',armor:'防具屋'}[type];const goods=(shopGoods[type]||[]).filter(g=>s.stage>=(g.minStage||0));const cards=goods.map(g=>{if(type==='tools'){const have=s.items[g.name]||0;return `<button class="btn choice" onclick="window.buyConsumable('${g.name}',${g.price})">${g.name}<span>${g.desc} ・ ${g.price}G ・ 所持 ${have}</span></button>`}const slot=type==='weapons'?'weapon':'armor';return `<button class="btn choice" onclick="window.chooseGearTarget('${type}','${g.name}',${g.price})">${g.name}<span>${g.desc} ・ ${g.price}G</span></button>`}).join('');showModal(`<h2>${title}</h2><p>所持金：<strong>${s.gold} G</strong></p>${shopMessage?`<div class="battle-log">${esc(shopMessage)}</div>`:''}<div class="menu-list">${cards}</div><div class="line"></div><div class="row"><button class="btn" onclick="window.shopHome()">店の一覧</button><button class="btn" onclick="window.closeModal()">店を出る</button></div>`)}
function buyConsumable(name,price){if(s.gold<price){shopMessage='お金が足りない。';sfx('error');shopCategory('tools');return}s.gold-=price;s.items[name]=(s.items[name]||0)+1;shopMessage=`${name}を買った。`;save();sfx('ok');shopCategory('tools')}
function chooseGearTarget(type,name,price){const people=ids().map(id=>{const a=stats(id),slot=type==='weapons'?'weapon':'armor',eq=s.equipment[id]?.[slot]||'なし';return `<button class="btn choice" onclick="window.buyGearFor('${type}','${name}',${price},'${id}')">${a.icon} ${a.name}<span>現在：${eq}</span></button>`}).join('');showModal(`<h2>${name}</h2><p>${type==='weapons'?'攻撃力':'守備力'}が上がります。誰に装備させますか？<br>価格：${price} G／所持金：${s.gold} G</p><div class="menu-list">${people}<button class="btn" onclick="window.shopCategory('${type}')">戻る</button></div>`)}
function buyGearFor(type,name,price,id){const slot=type==='weapons'?'weapon':'armor';if(s.gold<price){shopMessage='お金が足りない。';sfx('error');shopCategory(type);return}if(s.equipment[id]?.[slot]===name){shopMessage='その装備はすでに装備している。';shopCategory(type);return}s.gold-=price;s.equipment[id]=s.equipment[id]||{weapon:'',armor:''};s.equipment[id][slot]=name;ensureVitals();shopMessage=`${stats(id).name}に${name}を装備した。`;save();sfx('ok');shopCategory(type)}
function shrine(){if(!s)return;for(const id of ids()){s.hp[id]=stats(id).hpmax;s.mp[id]=stats(id).mpmax;s.dead[id]=false}s.log='潮守りの社で、みんなの力が戻った。';save();render();sfx('heal')}
function explore(){if(!s)return;initAudio();if(s.progress>=2)return;s.progress++;const stage=s.stage;let chance=stage===0?.52:.62;if(Math.random()<chance){startBattle(false)}else{s.log=['潮風に、遠い歌が混じった。','浜の人から旅の話を聞いた。','小さな宝箱を見つけた。'][Math.floor(Math.random()*3)];if(Math.random()<.28){s.items['浜のおにぎり']=(s.items['浜のおにぎり']||0)+1;s.log+=' 浜のおにぎりを手に入れた。'}render();save();sfx('ok')}if(s.progress>=2&&!s.battle){s.log='潮のしるしが、奥へ進む道を照らしている。';render();save()}}
function enemyFor(stage,boss=false){if(boss){let hp=stage===6?300:135+stage*26;return [{name:chapters[stage].boss,icon:chapters[stage].bossArt,hp,max:hp,atk:stage===6?30:15+stage*3,def:stage===6?12:5+stage,xp:stage===6?380:90+stage*18,gold:stage===6?300:55+stage*12,boss:true}]}let pool=enemies[stage],first={...pool[Math.floor(Math.random()*pool.length)]};first.max=first.hp;let out=[first];if(stage>1&&Math.random()<.22){let e={...pool[Math.floor(Math.random()*pool.length)]};e.max=e.hp;out.push(e)}return out}
function startBattle(boss){let dead=ids().every(id=>s.dead[id]||s.hp[id]<=0);if(dead){s.log='みんな疲れ切っている。潮守りの社で休もう。';render();return}let en=enemyFor(s.stage,boss);s.battle={enemies:en,order:ids(),turn:0,guard:false,boss,message:boss?chapters[s.stage].villain:'魔物があらわれた！'};render();sfx('hit')}
function boss(){if(s.progress<2)return;startBattle(true)}
function postExplore(){if(!s.flags.post||s.flags.post!==1)return;s.flags.post=2;s.log='星のかけらは、海に残された小さな約束を映し出した。';save();render();sfx('ok')}
function postBoss(){if(s.flags.post!==2)return;const hp=190;s.battle={enemies:[{name:'忘れられた約束',icon:'🌊',hp,max:hp,atk:27,def:10,xp:220,gold:120,boss:true}],order:ids(),turn:0,guard:false,boss:true,post:true,message:'潮の記憶を守るため、最後の試練が始まる。'};render();sfx('hit')}
function recap(){showModal(`<h2>冒険の記録</h2><p>仲間とともに${s.wins}回の戦いを越え、氷見の海に記憶を取り戻した。</p><p>ナギは「魚が苦手な人も、自分に合った食べ方を見つけられる」と知った。トトは海の精霊として、これからも浜を見守っていく。</p><button class="btn primary" style="width:100%" onclick="window.closeModal()">港へ戻る</button>`)}
function act(type){const b=s.battle;if(!b)return;let id=b.order[b.turn];if(s.dead[id]||s.hp[id]<=0){nextTurn();return}const a=stats(id),job=jobs[a.base||s.job];let targets=b.enemies.filter(e=>e.hp>0);if(!targets.length){win();return}if(type==='defend'){b.guard=true;b.message=`${a.name}は身を守っている。`;sfx('tap')}else if(type==='attack'){const e=targets[0],crit=Math.random()<.05,damage=Math.max(1,Math.floor(a.atk*1.5-e.def*.45+(Math.random()*5-2)+(crit?a.atk:0)));e.hp-=damage;b.message=crit?`会心の一撃！ ${e.name}に ${damage} のダメージ！`:`${a.name}の攻撃！ ${e.name}に ${damage} のダメージ。`;sfx(crit?'crit':'hit')}else{let skill=type==='skill';if(id==='nagi'){if(s.mp[id]<4){b.message='MPが足りない！';sfx('error')}else{s.mp[id]-=4;let t=ids().find(x=>s.dead[x]||s.hp[x]<stats(x).hpmax);if(t){s.dead[t]=false;s.hp[t]=s.dead[t]?Math.ceil(stats(t).hpmax*.3):Math.min(stats(t).hpmax,s.hp[t]+35);b.message=`ナギのいやしの水！ ${stats(t).name}を回復した。`;sfx('heal')}else{for(const x of ids())s.hp[x]=Math.min(stats(x).hpmax,s.hp[x]+12);b.message='ナギの応援！みんなのHPが少し回復。';sfx('heal')}}}else if(id==='toto'){if(s.mp[id]<5){b.message='MPが足りない！';sfx('error')}else{s.mp[id]-=5;let e=targets[0],d=18+Math.floor(s.lv*2+Math.random()*8);e.hp-=d;b.message=`トトの波しぶき！ ${e.name}に ${d} のダメージ。`;sfx('hit')}}else{let key=a.base||s.job,j=jobs[key];if(s.mp[id]<(j.cost||3)){b.message='MPが足りない！';sfx('error')}else{s.mp[id]-=j.cost||3;if(j.kind==='guard'){b.guard=true;b.message=`${a.name}の守りの潮！みんなの守備力が上がった。`;sfx('ok')}else if(j.kind==='debuff'){let e=targets[0];e.def=Math.max(0,e.def-3);b.message=`${a.name}は${e.name}の弱点を見抜いた！`;sfx('ok')}else{let list=j.kind==='all'?targets:[targets[0]];list.forEach(e=>e.hp-=Math.floor((j.kind==='magic'?24:17)+s.lv*2+Math.random()*7));b.message=`${a.name}の${j.skill}！魔物にダメージ！`;sfx('hit')}}}}
if(b.enemies.every(e=>e.hp<=0)){win();return}nextTurn()}
function nextTurn(){const b=s.battle;b.turn=(b.turn+1)%b.order.length;if(b.turn===0){enemyTurn();return}const id=b.order[b.turn];if(s.dead[id]||s.hp[id]<=0){nextTurn();return}b.message=`${stats(id).name}はどうする？`;render()}
function enemyTurn(){const b=s.battle,living=ids().filter(id=>!s.dead[id]&&s.hp[id]>0);if(!living.length){wipe();return}let e=b.enemies.find(x=>x.hp>0);if(!e){win();return}let target=living[Math.floor(Math.random()*living.length)],a=stats(target),damage=Math.max(2,e.atk-Math.floor(a.def*.45)-(b.guard?5:0)+Math.floor(Math.random()*5));s.hp[target]-=damage;b.message=`${e.name}の攻撃！ ${a.name}は ${damage} のダメージ。`;if(s.hp[target]<=0){s.hp[target]=0;s.dead[target]=true;b.message+=` ${a.name}は戦闘不能になった！`}b.guard=false;sfx('hit');if(ids().every(id=>s.dead[id]||s.hp[id]<=0)){wipe();return}b.turn=0;while(s.dead[b.order[b.turn]]||s.hp[b.order[b.turn]]<=0)b.turn=(b.turn+1)%b.order.length;render()}
function xpNeed(lv){return Math.floor(42*Math.pow(lv,1.52))}
function win(){let b=s.battle;const xp=b.enemies.reduce((n,e)=>n+e.xp,0),gold=b.enemies.reduce((n,e)=>n+e.gold,0);s.xp+=xp;s.gold+=gold;s.wins++;let line=`魔物をたおした！ 経験値 ${xp}、${gold}Gを手に入れた。`;if(Math.random()<.34){let [item]=drops[Math.floor(Math.random()*drops.length)];s.items[item]=(s.items[item]||0)+1;line+=` ${item}を見つけた！`}while(s.xp>=xpNeed(s.lv)){s.xp-=xpNeed(s.lv);s.lv++;for(const id of ['hero',...s.unlocked]){const a=stats(id);s.hp[id]=Math.min(a.hpmax,(s.hp[id]||0)+5);s.mp[id]=Math.min(a.mpmax,(s.mp[id]||0)+3)}line+=` レベル${s.lv}に上がった！`}delete s.battle;if(b.post){s.flags.post=3;line+=' 星のかけらは静かな光に変わった。海を見守る小さな精霊が生まれた！'}else if(b.boss){if(s.stage<6){s.stage++;s.progress=0;const who=stageRecruit(s.stage);if(who&&!s.unlocked.includes(who)){s.unlocked.push(who);s.activeGuest=who;line+=` ${roster[who].name}が仲間になった！`}line+=` ${chapters[s.stage].place}へ。${chapters[s.stage].intro}`}else{s.flags.ending=true;s.flags.post=1;line+=' 氷見の海に魚と記憶が戻った。港でエンディングを迎えた。'}}else if(s.progress>=2)line+=' 奥にボスの気配がする。';s.log=line;ensureVitals();save();render();sfx('win')}
function stageRecruit(stage){return ({1:'fisher',2:'herbalist',3:'artisan',4:'merchant',5:'shipwright'})[stage]}
function wipe(){delete s.battle;s.gold=Math.floor(s.gold*.9);for(const id of ids()){s.dead[id]=false;s.hp[id]=Math.max(1,Math.floor(stats(id).hpmax*.35));s.mp[id]=Math.floor(stats(id).mpmax*.35)}s.progress=Math.max(0,s.progress-1);s.log='みんなは潮守りの社へ運ばれた。所持金の一部を失ったが、道具と経験値は無事だ。';save();render();sfx('error')}
